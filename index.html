<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>CHEAT CODE: HAPPY</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{
  --ink:#1b2a4a; --quiet:#5b6b8a; --blue:#2f7fe0; --blue2:#5aa9ff; --pink:#ff7aa8;
  --yellow:#ffd25e; --paper:#fffaf0; --line:#24406e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Galmuri11','Galmuri9',ui-monospace,monospace;color:var(--ink);background:#000}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:50}

/* ---------- BOOT ---------- */
#boot{background:#000;color:#bfe9ff;gap:18px;text-align:center;padding:16px}
.boot-logo{font-size:26px;color:#fff;letter-spacing:2px;text-shadow:0 0 12px #5aa9ff}
.boot-sub{font-size:12px;color:#7aa}
.bar{width:min(320px,80vw);height:22px;border:2px solid #bfe9ff;padding:3px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#7fd3ff 0 10px,transparent 10px 13px)}
#bootTxt{font-size:13px;min-height:1em}
.skip{font-size:11px;color:#567;margin-top:6px}

/* ---------- SKY (shared) ---------- */
.sky{position:absolute;inset:0;overflow:hidden;
  background:linear-gradient(#5fb8ff 0%,#a8deff 45%,#e6f8ff 72%,#bff0c8 72.2%,#7fd68f 100%)}
.hill{position:absolute;left:-10%;right:-10%;bottom:-38%;height:70%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 20%,#a6ec9e,#58c46b 60%);box-shadow:inset 0 10px 30px rgba(255,255,255,.5)}
.cloud{position:absolute;width:12px;height:12px;background:#fff;opacity:.95;
  box-shadow:12px 0 #fff,24px 0 #fff,36px 0 #fff,12px -12px #fff,24px -12px #fff,24px -24px #fff,36px -12px #fff,48px 0 #fff,0 0 #fff;
  animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-120px) scale(var(--s,2))}to{transform:translateX(110vw) scale(var(--s,2))}}
.bubble{position:absolute;bottom:-60px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(255,255,255,.25) 35%,rgba(120,200,255,.18) 70%,rgba(255,255,255,.5));
  border:1px solid rgba(255,255,255,.7);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(30px)}}

/* ---------- LOGIN ---------- */
#login .panel{position:relative;z-index:2;width:min(340px,90vw);padding:22px;border-radius:14px;
  background:linear-gradient(rgba(255,255,255,.92),rgba(225,243,255,.9));border:2px solid #fff;
  box-shadow:0 10px 30px rgba(0,60,140,.25),inset 0 1px 0 #fff;text-align:center}
.avatar{width:72px;height:72px;margin:0 auto 10px;border-radius:12px;border:3px solid #fff;
  background:linear-gradient(#ffd2e2,#ff9ec2);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.panel h1{font-size:18px;margin:4px 0 2px}
.panel p{font-size:12px;color:var(--quiet);margin:0 0 14px}
.field{width:100%;padding:10px;border:2px solid var(--line);border-radius:6px;background:#fff;font-size:14px;outline:none}
.field:focus{border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:2px solid var(--line);border-radius:6px;
  background:linear-gradient(#fff,#d8ecff);font-size:13px;box-shadow:0 2px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:linear-gradient(#7ec3ff,#2f7fe0);color:#fff;text-shadow:0 1px 0 #1a4f99}
.btn.pink{background:linear-gradient(#ffb3cd,#ff6f9f);color:#fff;text-shadow:0 1px 0 #a33}
#login .btn{margin-top:12px;width:100%;justify-content:center}

/* ---------- DESKTOP ---------- */
#desktop{position:fixed;inset:0}
#icons{position:absolute;top:16px;left:16px;display:flex;flex-direction:column;gap:6px;z-index:2}
.icon{width:96px;padding:8px 4px;border:1px solid transparent;border-radius:6px;background:none;
  display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.icon:hover,.icon:focus-visible{background:rgba(255,255,255,.35);border-color:rgba(255,255,255,.8);outline:none}
.icon span{font-size:12px;color:#fff;text-shadow:1px 1px 0 #1b3a6b,-1px -1px 0 #1b3a6b,1px -1px 0 #1b3a6b,-1px 1px 0 #1b3a6b;word-break:keep-all}
.icon .lock{position:absolute;right:20px;top:34px}
.icon.shake{animation:shake .5s}
.icon.glow svg{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px #ff7aa8)}
@keyframes shake{20%,60%{transform:translateX(-4px) rotate(-3deg)}40%,80%{transform:translateX(4px) rotate(3deg)}}

#quest{position:absolute;top:16px;right:16px;width:230px;z-index:3;border:2px solid #8a5a17;border-radius:6px;
  background:linear-gradient(#fff6d8,#ffe8a6);box-shadow:3px 3px 0 rgba(90,50,0,.3);font-size:12px}
#quest .qh{background:linear-gradient(#ffb547,#e98a10);color:#fff;padding:5px 8px;text-shadow:1px 1px 0 #8a4a00;display:flex;justify-content:space-between}
#quest .qb{padding:8px 10px}
#quest .qt{font-size:13px;margin-bottom:6px}
#quest ul{list-style:none;margin:6px 0 0;padding:0}
#quest li{padding:2px 0;color:#7a5a20}
#quest li.ok{color:#2b8a3e}
.qbar{height:10px;border:2px solid #8a5a17;background:#fff;margin-top:6px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#ff7aa8,#ffd25e);transition:width .5s}
#quest .min{border:0;background:none;color:#fff;padding:0 2px}
#quest.folded .qb{display:none}

/* ---------- TASKBAR ---------- */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:42px;z-index:900;display:flex;align-items:center;gap:8px;padding:0 6px;
  background:linear-gradient(#5aa9ff,#2f7fe0 55%,#1f63c4);border-top:2px solid #9fd0ff}
#startBtn{height:32px;padding:0 14px;border-radius:0 14px 14px 0;border:2px solid #1b6a1b;color:#fff;font-size:13px;
  background:linear-gradient(#7fdc6a,#2fa52f);text-shadow:1px 1px 0 #165a16}
#inv{display:flex;gap:4px;margin-left:4px}
.slot{width:54px;height:30px;border:2px solid #16438a;background:rgba(255,255,255,.2);border-radius:4px;display:flex;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#fff}
.slot.on{background:linear-gradient(#fff3c4,#ffd25e);color:#7a4a00}
#tbRight{margin-left:auto;display:flex;align-items:center;gap:6px;color:#fff;font-size:12px}
#bgmBtn{height:28px;padding:0 8px;border:2px solid #16438a;border-radius:4px;background:rgba(255,255,255,.2);color:#fff;font-size:11px}
#clock{padding:0 8px;height:30px;display:flex;align-items:center;background:rgba(0,30,90,.25);border:1px solid rgba(255,255,255,.3);border-radius:4px}
#startMenu{position:absolute;left:4px;bottom:46px;z-index:950;width:220px;background:#fff;border:2px solid var(--line);border-radius:8px 8px 0 0;overflow:hidden;box-shadow:3px 3px 0 rgba(0,30,90,.3)}
#startMenu .sm-h{background:linear-gradient(#5aa9ff,#2f7fe0);color:#fff;padding:10px;font-size:13px}
#startMenu button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid #e3ecf8;background:#fff;font-size:12px}
#startMenu button:hover{background:#e8f3ff}

/* ---------- WINDOWS ---------- */
.win{position:absolute;width:460px;max-width:calc(100vw - 16px);background:#fff;border:2px solid #1f4f9a;border-radius:8px 8px 4px 4px;
  box-shadow:5px 5px 0 rgba(0,40,100,.25);display:flex;flex-direction:column;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.win-title{height:30px;flex:none;display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;cursor:move;user-select:none;touch-action:none;
  background:linear-gradient(#7cc0ff,#3a8ae8 50%,#2f7fe0);color:#fff;font-size:12px;text-shadow:1px 1px 0 #1a4f99;border-radius:5px 5px 0 0}
.win.inactive .win-title{background:linear-gradient(#b9d6f5,#8fb4e0)}
.win-close{margin-left:auto;width:22px;height:22px;border:2px solid #fff;border-radius:4px;background:linear-gradient(#ff9c8a,#e8452c);color:#fff;font-size:11px;line-height:1;padding:0}
.win-body{padding:14px;max-height:min(70vh,560px);overflow:auto;font-size:13px;line-height:1.6}

/* magazine */
.mag-page{height:340px;border:2px solid #333;background:var(--paper);padding:20px;overflow:auto;box-shadow:inset -10px 0 14px -10px rgba(0,0,0,.25);transform-origin:left center}
.mag-page.flip{animation:flip .45s ease-out}
@keyframes flip{from{transform:perspective(900px) rotateY(-75deg);opacity:.2}}
.mag-page h2{font-size:17px;margin:0 0 2px}
.mag-page .sub{font-size:12px;color:var(--quiet);margin-bottom:12px}
.mag-page .ph{border:2px dashed #c9b88a;background:#fff;padding:10px;color:#8a7a50;font-size:12px;margin-top:10px}
.cover{height:100%;margin:-20px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(160deg,#ffb3cd,#ffd25e 60%,#9fd8ff);color:#fff;text-shadow:2px 2px 0 rgba(160,40,90,.6)}
.cover .big{font-size:40px;line-height:1}
.mag-nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12px}
.toc li{padding:3px 0}

/* photo */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{aspect-ratio:1;border:2px solid #333;display:flex;align-items:flex-end;justify-content:center;padding:4px;font-size:11px;color:#fff;
  text-shadow:1px 1px 0 #333;position:relative;image-rendering:pixelated}
.thumb:hover{outline:3px solid var(--yellow)}
.viewer{margin-top:12px;border:2px solid #333;background:#222;padding:8px}
.viewer .shot{position:relative;height:220px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;text-align:center;padding:10px}
.viewer .cap{background:#fff;padding:8px;font-size:12px}
.sparkle{position:absolute;width:26px;height:26px;border:0;background:none;padding:0;animation:twinkle 1.1s infinite}
@keyframes twinkle{50%{transform:scale(.6) rotate(45deg);opacity:.5}}
.hint{font-size:11px;color:var(--quiet);margin-top:8px}

/* guestbook */
.gb-form{display:grid;gap:8px;border:2px solid #e2c36b;background:#fff9e3;padding:10px;border-radius:6px}
.gb-form textarea{min-height:70px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.sw{width:24px;height:24px;border:2px solid #fff;outline:2px solid #999;border-radius:4px;padding:0}
.sw.on{outline:3px solid var(--blue)}
.st{width:30px;height:30px;border:2px solid #ccc;background:#fff;border-radius:4px;font-size:15px;padding:0}
.st.on{border-color:var(--blue);background:#e8f3ff}
.board{margin-top:12px;padding:12px;border-radius:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;
  background:#c89a5c repeating-linear-gradient(45deg,rgba(0,0,0,.04) 0 3px,transparent 3px 7px)}
.memo{padding:10px 8px 8px;font-size:12px;line-height:1.5;box-shadow:2px 3px 0 rgba(0,0,0,.2);position:relative;word-break:break-all}
.memo b{display:block;font-size:11px;margin-top:6px;color:#555}
.memo .stk{position:absolute;right:4px;top:2px}

/* heart */
.code-boxes{display:flex;gap:6px;justify-content:center;margin:12px 0}
.piece{padding:6px 10px;border:2px solid #8a5a17;background:linear-gradient(#fff3c4,#ffd25e);border-radius:4px;font-size:14px}
.code-in{text-align:center;letter-spacing:6px;font-size:20px;text-transform:uppercase}
.wrong{animation:shake .4s}
.final h2{font-size:18px;text-align:center;margin:0 0 6px}
.heartwrap{position:relative;width:100%;max-width:360px;height:300px;margin:8px auto}
.hm{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));font-size:10px;padding:4px 6px;box-shadow:1px 2px 0 rgba(0,0,0,.2);white-space:nowrap;
  animation:in .6s backwards}
@keyframes in{from{transform:translate(-50%,-50%) scale(0)}}
.hd{position:absolute;transform:translate(-50%,-50%);line-height:0;animation:in .4s backwards}
.heartwrap{overflow:hidden}
.heartwrap .center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;font-size:12px;color:#d63a6f}
.msg{border:2px dashed #ff9ec2;background:#fff5f9;padding:12px;font-size:13px}

/* toast */
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{display:flex;align-items:center;gap:10px;padding:10px 16px;border:2px solid #8a5a17;border-radius:6px;background:linear-gradient(#fffbe8,#ffe08a);
  box-shadow:3px 3px 0 rgba(90,50,0,.35);font-size:13px;animation:tin .35s ease-out,tout .4s 2.6s forwards}
@keyframes tin{from{transform:translateY(-20px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}

/* ending */
#ending{position:fixed;inset:0;z-index:3000;background:#000;color:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.credits{position:absolute;left:0;right:0;top:100%;text-align:center;font-size:14px;line-height:2.4;animation:roll 14s linear forwards}
.credits h3{font-size:20px;color:var(--yellow);margin:30px 0 4px}
.credits .k{color:#8ab}
@keyframes roll{to{transform:translateY(-100%) translateY(-100vh)}}
.card{position:relative;z-index:2;width:min(340px,90vw);padding:22px;border:3px solid #fff;border-radius:12px;text-align:center;color:var(--ink);
  background:linear-gradient(160deg,#ffd2e2,#fff3c4 55%,#c9ecff);box-shadow:0 0 40px rgba(255,122,168,.6);animation:pop .4s}
.card .tag{font-size:12px;color:#d63a6f}
.card h2{margin:6px 0;font-size:20px}
.card .btns{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
#skipCred{position:absolute;right:16px;bottom:16px;z-index:3;font-size:12px;color:#aaa;background:none;border:1px solid #555;padding:6px 10px}

/* mobile */
@media (max-width:680px){
  #icons{top:auto;bottom:126px;left:8px;right:8px;flex-direction:row;flex-wrap:wrap;justify-content:space-around}
  .icon{width:72px}
  .icon .lock{right:10px}
  #quest{top:10px;left:10px;right:10px;width:auto}
  .win{left:6px!important;right:6px;top:8px!important;width:auto!important;bottom:48px}
  .win-body{max-height:none;flex:1}
  .slot{width:40px}
  .slot .pc{display:none}
  #bgmBtn .lbl{display:none}
}
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot" class="screen">
  <div class="boot-logo">CHEAT CODE : HAPPY</div>
  <div class="boot-sub">Seokjin OS ver. 1204</div>
  <div class="bar"><i id="bootBar"></i></div>
  <div id="bootTxt">행복을 불러오는 중… 0%</div>
  <div class="skip">클릭하면 건너뛰기</div>
</div>

<!-- LOGIN -->
<div id="login" class="screen hidden">
  <div class="sky" id="loginSky"><div class="hill"></div></div>
  <form class="panel" id="loginForm">
    <div class="avatar" id="loginAvatar"></div>
    <h1>환영합니다</h1>
    <p>탐험가의 이름을 입력해 주세요</p>
    <input class="field" id="nick" maxlength="12" placeholder="닉네임" autocomplete="off">
    <button class="btn primary" type="submit">로그인 ▶</button>
  </form>
</div>

<!-- DESKTOP -->
<div id="desktop" class="hidden">
  <div class="sky" id="deskSky"><div class="hill"></div></div>
  <div id="icons"></div>
  <aside id="quest"></aside>
  <div id="windows"></div>
  <div id="startMenu" class="hidden">
    <div class="sm-h" id="smName">탐험가</div>
    <button id="smQuest">퀘스트 안내 다시 보기</button>
    <button id="smReset">진행 초기화 (단서·해금)</button>
    <button id="smWipe">모든 데이터 지우기 (방명록 포함)</button>
    <button id="smLogout">로그아웃</button>
  </div>
  <div id="taskbar">
    <button id="startBtn">START</button>
    <div id="inv"></div>
    <div id="tbRight">
      <button id="bgmBtn">♪ <span class="lbl">BGM</span> <span id="bgmState">OFF</span></button>
      <div id="clock">--:--</div>
    </div>
  </div>
</div>

<div id="ending" class="hidden"></div>
<div id="toast"></div>

<script>
(() => {
/* ================= STATE ================= */
const KEY = 'cheatcode-happy-v1';
const PIECES = ['HA', 'PP', 'Y'];
const CODE = 'HAPPY';
const NUM = ['①', '②', '③'];
const SEED = [
  { name: '구름', text: '좋아하는 노래를 크게 틀고 걷는 저녁이요', color: '#fff59d', sticker: '★' },
  { name: '보라', text: '진이 웃는 걸 보면 저도 행복해져요!', color: '#ffd1e1', sticker: '♥' },
  { name: '달토끼', text: '맛있는 거 먹고 푹 자는 날', color: '#c8f1ff', sticker: '✿' }
];
let S = { nick: '', clues: [false, false, false], opened: false, memos: null, introSeen: false };
function load() { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) S = Object.assign(S, d); } catch (e) {} if (!S.memos) S.memos = SEED.slice(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const allClues = () => S.clues.every(Boolean);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ================= PIXEL ICONS ================= */
function pix(rows, pal, scale) {
  const h = rows.length, w = rows[0].length; let r = '';
  rows.forEach((row, y) => [...row].forEach((c, x) => { if (pal[c]) r += `<rect x="${x}" y="${y}" width="1.05" height="1.05" fill="${pal[c]}"/>`; }));
  return `<svg viewBox="0 0 ${w} ${h}" width="${w * scale}" height="${h * scale}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
const ICON = {
  folder: (s = 4) => pix(['.aaaa.......', 'abbbbaaaaaa.', 'abbbbbbbbbba', 'acddcccccccA'.replace('A', 'a'), 'adcccccccccA'.replace('A', 'a'), 'acccccccccca', 'acccccccccca', 'acccccccccca', 'acccccccccca', 'aaaaaaaaaaaa'],
    { a: '#a8670e', b: '#ffc23d', c: '#ffe08a', d: '#fff6d0' }, s),
  folderPink: (s = 4) => pix(['.aaaa.......', 'abbbbaaaaaa.', 'abbbbbbbbbba', 'acddcccccccA'.replace('A', 'a'), 'adcccccccccA'.replace('A', 'a'), 'acccccccccca', 'acccccccccca', 'acccccccccca', 'acccccccccca', 'aaaaaaaaaaaa'],
    { a: '#a83a64', b: '#ff7aa8', c: '#ffc2d6', d: '#fff0f5' }, s),
  note: (s = 4) => pix(['aaaaaaaaaa', 'abbbbbbbba', 'aaaaaaaaaa', 'acccccccca', 'acddddddca', 'acccccccca', 'acddddddca', 'acccccccca', 'acddddccca', 'acccccccca', 'aaaaaaaaaa'],
    { a: '#5a4a2a', b: '#ff8fb1', c: '#fffbe8', d: '#9bb3c9' }, s),
  heart: (s = 5) => pix(['.aa...aa.', 'acba.acba', 'abbbabbba', 'abbbbbbba', '.abbbbba.', '..abbba..', '...aba...', '....a....'],
    { a: '#8a1f45', b: '#ff5c93', c: '#ffd1e1' }, s),
  trash: (s = 4) => pix(['...aaaa...', 'aaaaaaaaaa', 'abbbbbbbba', '.acbcbcba.', '.acbcbcba.', '.acbcbcba.', '.acbcbcba.', '.acbcbcba.', '..aaaaaa..'],
    { a: '#3a5a7a', b: '#e2f2ff', c: '#9ac0e0' }, s),
  gem: (s = 3) => pix(['...a...', '..aba..', '.abcba.', 'abcccba', '.abcba.', '..aba..', '...a...'],
    { a: '#8a5a17', b: '#ffd25e', c: '#fff6d0' }, s),
  lock: (s = 2) => pix(['.aaaa.', 'a....a', 'a....a', 'bbbbbb', 'bbccbb', 'bbccbb', 'bbbbbb'],
    { a: '#555', b: '#ffc23d', c: '#7a4a00' }, s),
  star: (s = 3) => pix(['...a...', '...a...', '.aabaa.', 'aabbbaa', '.aabaa.', '...a...', '...a...'],
    { a: '#fff', b: '#ffe86b' }, s),
  face: (s = 5) => pix(['..aaaa..', '.abbbba.', 'abcbbcba', 'abbbbbba', 'abdbbdba', 'abbddbba', '.abbbba.', '..aaaa..'],
    { a: '#8a1f45', b: '#fff', c: '#333', d: '#ff7aa8' }, s)
};

/* ================= SOUND ================= */
let actx = null;
function ac() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return actx; }
function tone(f, start = 0, dur = .12, type = 'square', vol = .04) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  click: () => tone(880, 0, .05),
  item: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, i * .08, .14)),
  deny: () => { tone(220, 0, .15, 'sawtooth'); tone(180, .15, .2, 'sawtooth'); },
  unlock: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .1, .2, 'triangle', .06))
};
let bgmTimer = null, bgmStep = 0;
const MEL = [659, 784, 880, 784, 659, 587, 523, 587, 659, 0, 659, 784, 880, 1047, 988, 880, 784, 0, 698, 659, 587, 523, 587, 659, 523, 0];
const BASS = [131, 131, 165, 165, 175, 175, 196, 196];
function bgmToggle() {
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; $('#bgmState').textContent = 'OFF'; return; }
  ac(); $('#bgmState').textContent = 'ON';
  bgmTimer = setInterval(() => {
    const n = MEL[bgmStep % MEL.length]; if (n) tone(n, 0, .18, 'square', .025);
    if (bgmStep % 2 === 0) tone(BASS[(bgmStep / 2 | 0) % BASS.length], 0, .25, 'triangle', .05);
    bgmStep++;
  }, 230);
}

/* ================= WINDOWS ================= */
let z = 10, cascade = 0;
function openWin(id, title, build, width = 460) {
  let w = document.getElementById('w-' + id);
  if (w) { focusWin(w); return w; }
  w = document.createElement('div'); w.className = 'win'; w.id = 'w-' + id; w.style.width = width + 'px';
  const vw = innerWidth, vh = innerHeight;
  w.style.left = Math.max(8, Math.min(vw - width - 8, (vw - width) / 2 + (cascade % 5) * 24 - 40)) + 'px';
  w.style.top = Math.max(8, Math.min(vh - 300, 60 + (cascade % 5) * 24)) + 'px'; cascade++;
  w.innerHTML = `<div class="win-title"><span>${title}</span><button class="win-close" aria-label="닫기">✕</button></div><div class="win-body"></div>`;
  $('#windows').appendChild(w);
  w.querySelector('.win-close').onclick = e => { e.stopPropagation(); sfx.click(); w.remove(); };
  w.addEventListener('pointerdown', () => focusWin(w));
  drag(w); focusWin(w); build(w.querySelector('.win-body'), w); return w;
}
function focusWin(w) { document.querySelectorAll('.win').forEach(x => x.classList.add('inactive')); w.classList.remove('inactive'); w.style.zIndex = ++z; }
function drag(w) {
  const bar = w.querySelector('.win-title'); let sx, sy, ox, oy, on = false;
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('.win-close') || innerWidth <= 680) return;
    on = true; sx = e.clientX; sy = e.clientY; ox = w.offsetLeft; oy = w.offsetTop; bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', e => {
    if (!on) return;
    w.style.left = Math.max(-w.offsetWidth + 80, Math.min(innerWidth - 80, ox + e.clientX - sx)) + 'px';
    w.style.top = Math.max(0, Math.min(innerHeight - 72, oy + e.clientY - sy)) + 'px';
  });
  bar.addEventListener('pointerup', () => on = false);
}

function renderFinal(b) {
  const ms = S.memos.slice(-16), n = ms.length;
  const hp = t => [16 * Math.pow(Math.sin(t), 3), 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)];
  const DOTS = 36;
  const dots = Array.from({ length: DOTS }, (_, k) => {
    const [x, y] = hp((k / DOTS) * Math.PI * 2);
    return `<span class="hd" style="left:${50 + x * 2.6}%;top:${46 - y * 2.9}%;animation-delay:${k * .03}s">${ICON.heart(1.4)}</span>`;
  }).join('');
  const notes = ms.map((m, k) => {
    const [x, y] = hp(((k + .5) / n) * Math.PI * 2);
    const txt = m.text.length > 7 ? m.text.slice(0, 7) + '…' : m.text;
    return `<div class="hm" title="${esc(m.text)} — ${esc(m.name)}" style="left:${50 + x * 2.2}%;top:${46 - y * 2.5}%;background:${m.color};--r:${((k * 23) % 11) - 5}deg;animation-delay:${.8 + k * .08}s">${esc(txt)}</div>`;
  }).join('');
  const notesAll = dots + notes;
  b.innerHTML = `<div class="final"><h2>석진에게 행복이란?</h2>
    <div class="msg">[최종 메시지 자리]<br>인터뷰 발췌나 에디터가 정리한 답을 이곳에 넣어 주세요.<br><br>${esc(S.nick)} 님, 여기까지 와 줘서 고마워요.</div>
    <div class="heartwrap">${notesAll}<div class="center">${ICON.heart(4)}<br>모두의 행복</div></div>
    <div class="hint" style="text-align:center">방명록에 남겨진 마음들이 하나의 하트가 되었어요</div>
    <div style="text-align:center;margin-top:12px"><button class="btn pink" id="toEnd">엔딩 보기 ▶</button></div></div>`;
  b.querySelector('#toEnd').onclick = showEnding;
}

    b.innerHTML = `<div style="display:flex;gap:10px;align-items:center">${ICON.note(3)}<div><b>버려진_걱정.txt</b><br>여기엔 아무것도 없어요.<br>걱정은 이미 비워 뒀거든요.</div></div><div class="hint">(이스터에그 자리 — 숨겨진 사진이나 짧은 메시지를 넣어도 좋아요)</div>`;
  }, 340);
}

/* ================= ENDING ================= */
function showEnding() {
  const e = $('#ending'); e.classList.remove('hidden'); sfx.unlock();
  e.innerHTML = `<div class="credits" id="cred">
    <h3>CHEAT CODE : HAPPY</h3><div>행복을 찾아가는 여정</div>
    <h3>기획</h3><div class="k">[이름]</div><h3>디자인</h3><div class="k">[이름]</div>
    <h3>개발</h3><div class="k">[이름]</div><h3>에디터</h3><div class="k">[이름]</div>
    <h3>그리고</h3><div class="k">${esc(S.nick)} 님과 방명록에 마음을 남긴 모든 분</div>
    <h3>THANK YOU</h3></div><button id="skipCred">건너뛰기 ▶</button>`;
  const card = () => {
    e.innerHTML = `<div class="card"><div class="tag">QUEST COMPLETE</div>${ICON.heart(5)}<h2>행복을 찾아서</h2>
      <div>${esc(S.nick)} 님, 모든 조각을 찾았어요!</div><div class="hint">조각 ${PIECES.join(' + ')} = ${CODE}</div>
      <div class="btns"><button class="btn" id="eDesk">바탕화면으로</button><button class="btn primary" id="eReplay">처음부터 다시 플레이</button></div></div>`;
    $('#eDesk').onclick = () => e.classList.add('hidden');
    $('#eReplay').onclick = () => { e.classList.add('hidden'); resetProgress(); };
  };
  $('#cred').addEventListener('animationend', card);
  $('#skipCred').onclick = card;
}

/* ================= MENU / RESET ================= */
function resetProgress() {
  S.clues = [false, false, false]; S.opened = false; save();
  $('#windows').innerHTML = ''; renderIcons(); renderQuest(); renderInv(); setTimeout(openIntro, 300);
}
$('#startBtn').onclick = e => { e.stopPropagation(); sfx.click(); $('#startMenu').classList.toggle('hidden'); };
document.addEventListener('pointerdown', e => { if (!e.target.closest('#startMenu') && !e.target.closest('#startBtn')) $('#startMenu').classList.add('hidden'); });
$('#smQuest').onclick = () => { $('#startMenu').classList.add('hidden'); openIntro(); };
$('#smReset').onclick = () => { $('#startMenu').classList.add('hidden'); resetProgress(); };
$('#smWipe').onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };
$('#smLogout').onclick = () => { $('#startMenu').classList.add('hidden'); $('#windows').innerHTML = ''; toLogin(); };
$('#bgmBtn').onclick = bgmToggle;

/* ================= INIT ================= */
load();
decorate($('#loginSky')); decorate($('#deskSky'));
$('#loginAvatar').innerHTML = ICON.face();
boot();
})();
</script>
</body>
</html>
